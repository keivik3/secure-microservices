name: Docker demo
on: [pull_request]
permissions: {contents: read}

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          sh scripts/init_env.sh
          docker compose config --quiet
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r services/api_gateway/requirements.txt
          pip-audit -r services/repair_service/requirements.txt
          pip-audit -r services/notification_service/requirements.txt
          sh scripts/demo.sh docker
