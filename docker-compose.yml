# Rail Repair gRPC — заявки на ремонт железной дороги.
#
# ДЗ 4: сегментация сетей. Три изолированных сегмента вместо одной плоской сети:
#   frontend-net — frontend передаёт REST-запросы только в api-gateway
#   app-net      — gRPC-сервисы общаются между собой
#   data-net     — хранилища недоступны сервисам из frontend-net и app-net без data-net
# Сервис, подключённый к нескольким сетям, — маршрутизатор между сегментами.
# Проверка сегментации: scripts/check_network.sh

x-postgres-ha: &postgres-ha
  image: docker.io/library/postgres:16-alpine@sha256:9f5be6795d4e9dfc0dca4c8a46eb858a9ddef631fc6b57953960f578d3fb1f9b
  profiles: ["ha-demo"]
  tmpfs:
    - /var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U app -d rail_repair"]
    interval: 2s
    timeout: 2s
    retries: 30
  restart: "no"
  networks:
    - data-net

x-rabbitmq-ha: &rabbitmq-ha
  image: docker.io/library/rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
  profiles: ["ha-demo"]
  entrypoint: ["/bin/sh", "/rabbitmq-entrypoint.sh"]
  environment: &rabbitmq-ha-environment
    HOME: /tmp/rabbitmq
    RABBITMQ_DEFAULT_USER: app
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run sh scripts/init_env.sh}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Run sh scripts/init_env.sh}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 3s
    timeout: 10s
    retries: 30
  restart: "no"
  networks:
    - data-net

services:

  # ==================== Инфраструктура ====================

  keycloak:
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run sh scripts/init_env.sh}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped            # ДЗ 5: автоперезапуск при падении
    networks:
      - app-net

  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:9f5be6795d4e9dfc0dca4c8a46eb858a9ddef631fc6b57953960f578d3fb1f9b
    environment:
      POSTGRES_DB: rail_repair
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/init_env.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups             # ДЗ 5: сюда складываются дампы (scripts/backup.sh)
    restart: unless-stopped
    healthcheck:                       # ДЗ 5: healthcheck — compose знает, когда БД готова
      test: ["CMD-SHELL", "pg_isready -U app -d rail_repair"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data-net                       # ТОЛЬКО data-net: из app-net/frontend-net БД недоступна

  redis:
    image: docker.io/library/redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data-net

  rabbitmq:
    image: docker.io/library/rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run sh scripts/init_env.sh}
    ports:
      - "127.0.0.1:15672:15672"  # панель управления (для демонстрации событий на защите)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - data-net

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    networks:
      - app-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # ==================== Сервисы приложения ====================

  frontend:
    build:
      context: .
      dockerfile: ./services/frontend/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - frontend-net

  repair-service:
    build:
      context: .
      dockerfile: ./services/repair_service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy     # ДЗ 5: стартуем только когда БД реально готова
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/init_env.sh}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Run sh scripts/init_env.sh}
      TLS_ENABLED: "false"  # локальный demo использует plaintext gRPC
      ENABLE_GRPC_REFLECTION: "true"
    expose:
      - "50054"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 50054), 2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - app-net                        # принимает gRPC-вызовы от api-gateway
      - data-net                       # ходит в postgres/redis/rabbitmq

  notification-service:
    build:
      context: .
      dockerfile: ./services/notification_service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: app
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Run sh scripts/init_env.sh}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - data-net                       # нужен ТОЛЬКО брокер; в app-net его не пускаем

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api_gateway/Dockerfile
    depends_on:
      repair-service:
        condition: service_healthy
    environment:
      REPAIR_SERVICE_URL: repair-service:50054
      ENABLE_DOCS: "true"
    expose:
      - "8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - frontend-net
      - app-net

  postgres-ha-master:
    <<: *postgres-ha
    environment:
      POSTGRES_DB: rail_repair
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/init_env.sh}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?Run sh scripts/init_env.sh}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_slot_wal_keep_size=64MB"]
    volumes:
      - ./infrastructure/postgres/primary-init.sh:/docker-entrypoint-initdb.d/00-replication.sh:ro
      - ./services/repair_service/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  postgres-ha-standby:
    <<: *postgres-ha
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?Run sh scripts/init_env.sh}
    entrypoint: ["/bin/sh", "/standby-entrypoint.sh"]
    volumes:
      - ./infrastructure/postgres/standby-entrypoint.sh:/standby-entrypoint.sh:ro
    depends_on:
      postgres-ha-master:
        condition: service_healthy

  rabbitmq-ha-master:
    <<: *rabbitmq-ha
    hostname: rabbitmq-ha-master
    environment:
      <<: *rabbitmq-ha-environment
      RABBITMQ_NODENAME: rabbit@rabbitmq-ha-master
    volumes:
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/entrypoint.sh:/rabbitmq-entrypoint.sh:ro
      - type: volume
        source: rabbitmq-ha-master-data
        target: /var/lib/rabbitmq
        volume:
          nocopy: true

  rabbitmq-ha-standby-1:
    <<: *rabbitmq-ha
    hostname: rabbitmq-ha-standby-1
    environment:
      <<: *rabbitmq-ha-environment
      RABBITMQ_NODENAME: rabbit@rabbitmq-ha-standby-1
    volumes:
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/entrypoint.sh:/rabbitmq-entrypoint.sh:ro
      - type: volume
        source: rabbitmq-ha-standby-1-data
        target: /var/lib/rabbitmq
        volume:
          nocopy: true

  rabbitmq-ha-standby-2:
    <<: *rabbitmq-ha
    hostname: rabbitmq-ha-standby-2
    environment:
      <<: *rabbitmq-ha-environment
      RABBITMQ_NODENAME: rabbit@rabbitmq-ha-standby-2
    volumes:
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/entrypoint.sh:/rabbitmq-entrypoint.sh:ro
      - type: volume
        source: rabbitmq-ha-standby-2-data
        target: /var/lib/rabbitmq
        volume:
          nocopy: true

  ha-client:
    build:
      context: .
      dockerfile: ./services/repair_service/Dockerfile
    profiles: ["ha-demo"]
    entrypoint: ["sh", "-c", "sleep infinity"]
    environment:
      RABBITMQ_USER: app
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run sh scripts/init_env.sh}
    restart: "no"
    networks:
      - data-net

# ДЗ 4: три изолированных сегмента
networks:
  frontend-net:
    driver: bridge
  app-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  pgdata:
  rabbitmq-ha-master-data:
  rabbitmq-ha-standby-1-data:
  rabbitmq-ha-standby-2-data:
