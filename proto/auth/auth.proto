syntax = "proto3";

package auth;

// Порт internal/auth/proto/auth.proto из Go-версии (без изменений контракта)

message UserAuth {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message TokenRequest {
  string accessToken = 1;
}

message TokenResponse {
  string accessToken = 1;
  string refreshToken = 2;
  int64 expiresIn = 3;
}

message RoleResponse {
  string role = 1;        // "registered", "dispatcher", "inspector", "crew", "guest"
  bool authorized = 2;    // true, если пользователь зарегистрирован
}

message RefreshTokenRequest {
  string refreshToken = 1;
}

service AuthService {
  rpc Login (UserAuth) returns (TokenResponse);
  rpc ValidateToken (TokenRequest) returns (RoleResponse);
  rpc RegisterUser (RegisterUserRequest) returns (TokenResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (TokenResponse);
}
